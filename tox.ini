[tox]
minversion = 4.0
envlist = py37-{dense,sparse}, py38-{dense,sparse}, py39-{dense,sparse}, py310-{dense,sparse}, py311-{dense,sparse}
isolated_build = True

[testenv]
deps =
    -r{toxinidir}/requirements-dev.txt
    pytest
    pytest-cov
commands =
    dense: python -m pytest --data-type=dense {posargs}
    sparse: python -m pytest --data-type=sparse {posargs}
    python doctests.py

[testenv:coverage]
deps =
    {[testenv]deps}
    coverage
commands =
    python -m pytest --cov=src/karray --cov-report=xml --cov-report=term

[testenv:lint]
deps =
    ruff
commands =
    ruff check src tests

[testenv:type]
deps =
    mypy
    types-setuptools
commands =
    mypy src tests

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -W -b html docs/source docs/build/html
